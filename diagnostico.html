<title>Diagnóstico — Renacer en Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== Quiz — específico ===== */
  body{background:var(--mist);min-height:100vh;display:flex;flex-direction:column}
  .q-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
  .q-blob.a{width:460px;height:460px;background:var(--lav-tint);top:-160px;right:-120px}
  .q-blob.b{width:400px;height:400px;background:var(--teal-tint);bottom:-180px;left:-140px}

  .q-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:1.1rem var(--gutter)}
  .q-top .brand .wordmark{font-size:1.05rem}
  .q-back-home{display:inline-flex;align-items:center;gap:.5em;font-weight:500;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .q-back-home:hover{color:var(--ink)}
  .q-back-home svg{transform:rotate(180deg)}

  .q-wrap{position:relative;z-index:2;flex:1 0 auto;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,48px)}
  .q-card{
    width:100%;max-width:760px;background:#fff;border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);
    padding:clamp(26px,4vw,52px) clamp(24px,4vw,56px) clamp(22px,3vw,40px);
  }

  /* header: paso + tiempo + barra */
  .q-meta{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
  .q-step{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .q-time{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
  .q-track{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:clamp(26px,3.5vw,40px)}
  .q-fill{height:100%;width:12.5%;background:var(--navy);border-radius:99px;transition:width .45s var(--ease)}

  .q-h{font-family:var(--serif);font-weight:600;font-size:clamp(1.55rem,3.3vw,2.35rem);line-height:1.12;letter-spacing:-.01em;color:var(--ink);margin:0 0 .5rem}
  .q-sub{font-size:clamp(.95rem,1.4vw,1.08rem);color:var(--ink-soft);margin:0 0 clamp(22px,3vw,32px)}

  /* opciones */
  .q-options{display:flex;flex-direction:column;gap:.7rem}
  .opt{
    display:flex;align-items:center;gap:1rem;width:100%;text-align:left;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:1.05rem 1.2rem;font-family:var(--sans);color:var(--ink);
    transition:border-color .22s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease);
  }
  .opt:hover{border-color:var(--teal);background:var(--teal-tint);transform:translateY(-1px)}
  .opt.sel{border-color:var(--navy);background:var(--lav-tint);box-shadow:0 12px 26px -18px rgba(14,27,45,.5)}
  .opt-ic{width:42px;height:42px;flex:none;border-radius:11px;background:var(--mist);display:grid;place-items:center;color:var(--teal);transition:background .22s,color .22s}
  .opt:hover .opt-ic,.opt.sel .opt-ic{background:#fff;color:var(--navy)}
  .opt-ic svg{width:20px;height:20px}
  .opt-txt{flex:1;min-width:0}
  .opt-txt b{display:block;font-weight:600;font-size:1.02rem;line-height:1.25}
  .opt-txt span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
  .opt-arr{flex:none;color:var(--muted);transition:transform .22s var(--ease),color .22s}
  .opt:hover .opt-arr,.opt.sel .opt-arr{color:var(--navy);transform:translateX(3px)}
  .opt-arr svg{width:20px;height:20px;display:block}

  /* form final */
  .q-form{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.2rem}
  .q-field{display:flex;flex-direction:column;gap:.45rem}
  .q-field.full{grid-column:1 / -1}
  .q-field label{font-weight:600;font-size:.82rem;letter-spacing:.02em;color:var(--ink)}
  .q-field label .opt-req{color:var(--teal)}
  .q-field input,.q-field textarea{
    font-family:var(--sans);font-size:1rem;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;
    transition:border-color .2s,box-shadow .2s;width:100%;resize:vertical;
  }
  .q-field input::placeholder,.q-field textarea::placeholder{color:#a9b1bb}
  .q-field input:focus,.q-field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px var(--lav-tint)}
  .q-field textarea{min-height:96px;line-height:1.5}

  /* footer */
  .q-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:clamp(24px,3vw,34px)}
  .q-back{display:inline-flex;align-items:center;gap:.5em;background:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:.4rem 0;transition:color .2s}
  .q-back:hover{color:var(--ink)}
  .q-back svg{transform:rotate(180deg);width:16px;height:16px}
  .q-back[hidden]{visibility:hidden}
  .q-next{opacity:.45;pointer-events:none;transition:opacity .25s}
  .q-next.ready{opacity:1;pointer-events:auto}

  /* pantalla final / éxito */
  .q-done{text-align:center;padding:clamp(8px,2vw,20px) 0}
  .q-done .seal{width:74px;height:74px;border-radius:50%;background:var(--sage-tint);display:grid;place-items:center;color:var(--sage);margin:0 auto 1.4rem}
  .q-done .seal svg{width:34px;height:34px}
  .q-done h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0 0 .7rem;color:var(--ink)}
  .q-done p{font-size:1.05rem;color:var(--ink-soft);max-width:46ch;margin:0 auto 1.8rem}
  .q-summary{text-align:left;max-width:440px;margin:0 auto 2rem;background:var(--mist);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem}
  .q-summary .row{display:flex;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft);font-size:.93rem}
  .q-summary .row:last-child{border-bottom:none}
  .q-summary .row .k{flex:none;width:118px;color:var(--muted);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
  .q-summary .row .v{color:var(--ink);font-weight:500}

  /* bloque de recomendación */
  .q-reco{text-align:left;max-width:480px;margin:0 auto 1.4rem;background:var(--lav-tint);border:1px solid #ddd6ec;border-radius:18px;padding:1.6rem 1.7rem}
  .q-reco-tag{display:inline-block;font-family:var(--sans);font-weight:700;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);background:#fff;border-radius:99px;padding:.3rem .8rem;margin-bottom:.9rem}
  .q-reco h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.12;color:var(--ink);margin:0 0 .55rem}
  .q-reco p{font-size:.98rem;color:var(--ink-soft);margin:0 0 1.2rem}
  .q-wa-btn{--bg:#0E1B2D}
  .q-summary-wrap{max-width:440px;margin:1.6rem auto 0;text-align:left}
  .q-summary-wrap summary{cursor:pointer;font-family:var(--sans);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;text-align:center;padding:.5rem}
  .q-summary-wrap summary::-webkit-details-marker{display:none}
  .q-summary-wrap summary:hover{color:var(--ink)}
  .q-summary-wrap .q-summary{margin-top:.8rem}

  .q-legal{text-align:center;font-size:.78rem;color:var(--muted);margin-top:1rem}

  @media (max-width:560px){
    .q-form{grid-template-columns:1fr}
    .q-back-home span{display:none}
    .opt-txt span{display:none}
  }
</style>

      { ic:"i-spark", label:"Uso ChatGPT de vez en cuando", sub:"De forma suelta, sin sistema" },
      { ic:"i-team",  label:"La uso en mi día a día", sub:"Yo o mi equipo, con frecuencia" },
      { ic:"i-cpu",   label:"Ya tengo sistemas de IA andando", sub:"Quiero llevarlos más lejos" },
    ],
  },
  {
    key: "contacto",
    h: "¿Cómo es tu nombre?",
    sub: "Último paso. Con esto armo tu recomendación y, si querés, hablamos directo por WhatsApp.",
    form: true,
  },
];

// ====== Estado ======
const SAVE_KEY = "rd_diagnostico_v1";
let answers = {};
let cur = 0;
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"); answers = s.answers||{}; cur = Math.min(s.cur||0, STEPS.length-1); } catch(e){}

const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const stepLabel = document.getElementById("stepLabel");
const backBtn = document.getElementById("backBtn");
const footRight = document.getElementById("footRight");
const meta = document.getElementById("meta");
const track = document.getElementById("track");
const foot = document.getElementById("foot");

function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify({answers, cur})); }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function render(){
  const step = STEPS[cur];
  // progreso
  const pct = ((cur+1) / STEPS.length) * 100;
  fill.style.width = pct + "%";
  stepLabel.textContent = "Paso " + (cur+1) + " de " + STEPS.length;
  backBtn.hidden = cur === 0;
  footRight.innerHTML = "";

  if(step.form){ renderForm(step); return; }

  // pregunta con opciones
  let html = '<h2 class="q-h">'+esc(step.h)+'</h2>';
  if(step.sub) html += '<p class="q-sub">'+esc(step.sub)+'</p>';
  html += '<div class="q-options">';
  step.options.forEach((o,i)=>{
    const sel = answers[step.key] === o.label ? " sel" : "";
    html += '<button type="button" class="opt'+sel+'" data-i="'+i+'">'
      + '<span class="opt-ic"><svg><use href="#'+o.ic+'"></use></svg></span>'
      + '<span class="opt-txt"><b>'+esc(o.label)+'</b>'+(o.sub?'<span>'+esc(o.sub)+'</span>':'')+'</span>'
      + '<span class="opt-arr"><svg><use href="#i-arrow"></use></svg></span>'
      + '</button>';
  });
  html += '</div>';
  stage.innerHTML = html;

  stage.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      answers[step.key] = step.options[+btn.dataset.i].label;
      save();
      // feedback breve y avanza
      stage.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      setTimeout(()=>{ cur++; save(); render(); }, 240);
    });
  });
}

function renderForm(step){
  const a = answers;
  stage.innerHTML =
    '<h2 class="q-h">'+esc(step.h)+'</h2>'
    + '<p class="q-sub">'+esc(step.sub)+'</p>'
    + '<div class="q-form">'
    + '  <div class="q-field full"><label for="f-nombre">Tu nombre <span class="opt-req">*</span></label>'
    + '    <input id="f-nombre" type="text" placeholder="Nombre y apellido" value="'+esc(a.nombre||"")+'" autocomplete="name"></div>'
    + '  <div class="q-field full"><label for="f-meta">¿Qué te gustaría lograr o resolver? <span class="opt-req">*</span></label>'
    + '    <textarea id="f-meta" placeholder="Una o dos frases alcanzan. Ej: ordenar mis ventas, automatizar tareas, armar mis asistentes…">'+esc(a.meta||"")+'</textarea></div>'
    + '</div>';

  // botón enviar en el footer
  footRight.innerHTML = '<button class="btn lg q-next" id="sendBtn" type="button">Ver mi recomendación <svg class="arr" width="16" height="16"><use href="#i-arrow"></use></svg></button>';
  const nombre = document.getElementById("f-nombre");
  const metaT = document.getElementById("f-meta");
  const sendBtn = document.getElementById("sendBtn");

  function check(){
    a.nombre = nombre.value.trim();
    a.meta = metaT.value.trim();
    save();
    sendBtn.classList.toggle("ready", a.nombre.length>1 && a.meta.length>2);
  }
  nombre.addEventListener("input", check);
  metaT.addEventListener("input", check);
  check();

  sendBtn.addEventListener("click", finish);
}

function recommend(a){
  // Empresa con equipo -> INSIDE ; profesional / emprendedor -> PNI
  if(a.perfil === "Tengo una empresa con equipo"){
    return {
      key:"INSIDE",
      tag:"Para tu empresa",
      title:"INSIDE",
      desc:"Entro a trabajar adentro de tu negocio: ordenamos procesos y montamos sistemas de IA junto a tu equipo, con tu contexto real.",
      href:"index.html#inside",
      cta:"Conocer INSIDE",
    };
  }
  return {
    key:"PNI",
    tag:"Para vos",
    title:"PNI — Programa de Negocios Inteligentes",
    desc:"Aprendés a poner la IA a trabajar con vos y construís tus propios asistentes en 4 semanas. Pago único, acceso inmediato.",
    href:"PNI.html",
    cta:"Conocer el PNI",
  };
}

function buildWaUrl(a, reco){
  const L = [
    "Hola Fer 👋 Hice el diagnóstico en tu web y acá va mi info:",
    "",
    "• Soy: " + (a.perfil || "—"),
    "• Mi mayor cuello de botella: " + (a.dolor || "—"),
    "• Presupuesto: " + (a.presupuesto || "—"),
    "• Cuándo lo quiero hacer: " + (a.tiempo || "—"),
    "• Nivel de IA hoy: " + (a.nivel_ia || "—"),
    "• Quiero lograr: " + (a.meta || "—"),
    "",
    "Camino sugerido: " + reco.title,
    "Mi nombre: " + (a.nombre || "—"),
  ];
  return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(L.join("\n"));
}

function finish(){
  renderDone();
}

function renderDone(){
  meta.style.display = "none";
  track.style.display = "none";
  foot.style.display = "none";
  const a = answers;
  const reco = recommend(a);
  const waUrl = buildWaUrl(a, reco);

  const rows = [
    ["Perfil", a.perfil],
    ["Cuello de botella", a.dolor],
    ["Presupuesto", a.presupuesto],
    ["Tiempo", a.tiempo],
    ["Nivel de IA", a.nivel_ia],
  ].filter(r=>r[1]).map(r=>'<div class="row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>').join("");

  stage.innerHTML =
    '<div class="q-done">'
    + '<div class="seal"><svg><use href="#i-check"></use></svg></div>'
    + '<h2>Listo, '+esc((a.nombre||"").split(" ")[0]||"")+' 🌱</h2>'
    + '<p>Según lo que me contaste, este es el camino que más te conviene. Y si querés, hablamos directo.</p>'
    + '<div class="q-reco">'
    + '  <span class="q-reco-tag">Te recomiendo · '+esc(reco.tag)+'</span>'
    + '  <h3>'+esc(reco.title)+'</h3>'
    + '  <p>'+esc(reco.desc)+'</p>'
    + '  <a class="btn lav" href="'+reco.href+'">'+esc(reco.cta)+' <svg class="arr" width="15" height="15"><use href="#i-arrow"></use></svg></a>'
    + '</div>'
    + '<a class="btn lg q-wa-btn" href="'+waUrl+'" target="_blank" rel="noopener"><svg width="18" height="18" style="margin-right:.1em"><use href="#i-wa"></use></svg> Hablar con Fer por WhatsApp</a>'
    + '<details class="q-summary-wrap"><summary>Ver mis respuestas</summary><div class="q-summary">'+rows+'</div></details>'
    + '</div>';
  // limpiar progreso guardado para no reabrir en "done"
  localStorage.removeItem(SAVE_KEY);
}

render();
</script>
</body>
</html>
