document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) { return;
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"11b8b138-86a7-4650-a98d-3f4c911ab0b4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"79c29bf7-0425-4fc9-a07d-c7b99215f951\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ===== Renacer en Digital — sistema de estilos ===== */\n:root{\n  /* Paleta del brand book */\n  --navy:#0E1B2D;\n  --teal:#0F4C5C;\n  --lavender:#ACA2C9;\n  --mist:#F2F3F5;\n  --sage:#7A8F7A;\n\n  --ink:#0E1B2D;\n  --ink-soft:#3a4654;\n  --muted:#6a7480;\n  --line:#e4e6ea;\n  --line-soft:#eef0f3;\n  --white:#ffffff;\n\n  --lav-tint:#f0eef6;\n  --teal-tint:#eaf1f2;\n  --sage-tint:#eef2ee;\n\n  --serif:\"Playfair Display\",Georgia,serif;\n  --sans:\"Montserrat\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n\n  --maxw:1180px;\n  --gutter:clamp(20px,5vw,64px);\n  --r:14px;\n  --shadow-sm:0 1px 2px rgba(14,27,45,.05), 0 8px 24px -16px rgba(14,27,45,.18);\n  --shadow:0 24px 60px -36px rgba(14,27,45,.4);\n  --ease:cubic-bezier(.22,.61,.36,1);\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;\n  font-family:var(--sans);\n  color:var(--ink);\n  background:var(--white);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.6;\n  font-size:17px;\n  overflow-x:hidden;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ===== Typography ===== */\nh1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;color:var(--ink);letter-spacing:-.01em}\n.display{font-size:clamp(2.3rem,4.4vw,4.05rem)}\n.h1{font-size:clamp(2.1rem,4.6vw,3.6rem)}\n.h2{font-size:clamp(1.7rem,3.4vw,2.7rem)}\n.h3{font-size:clamp(1.25rem,2vw,1.7rem)}\n.lead{font-size:clamp(1.05rem,1.5vw,1.3rem);color:var(--ink-soft);font-weight:400}\n.eyebrow{\n  font-family:var(--sans);font-weight:600;font-size:.74rem;\n  letter-spacing:.22em;text-transform:uppercase;color:var(--teal);\n  display:inline-flex;align-items:center;gap:.6em;margin:0 0 1.1rem;\n}\n.eyebrow::before{content:\"\";width:26px;height:1.5px;background:var(--lavender)}\n.eyebrow.center{justify-content:center}\nem,.accent{font-style:italic;color:var(--lavender);font-family:var(--serif)}\n.serif-italic{font-family:var(--serif);font-style:italic}\n.muted{color:var(--muted)}\np{margin:0 0 1.1rem;text-wrap:pretty}\n\n/* ===== Layout helpers ===== */\n.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}\nsection{padding-block:clamp(72px,9vw,128px)}\n.section-mist{background:var(--mist)}\n.section-navy{background:var(--navy);color:#dfe3e8}\n.section-navy h1,.section-navy h2,.section-navy h3{color:#fff}\n.center{text-align:center}\n.measure{max-width:62ch}\n.measure-tight{max-width:46ch}\n.mx-auto{margin-inline:auto}\n.stack-sm>*+*{margin-top:.6rem}\n\n/* ===== Buttons ===== */\n.btn{\n  --bg:var(--teal);--fg:#fff;\n  display:inline-flex;align-items:center;gap:.6em;\n  font-family:var(--sans);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;\n  padding:.95em 1.7em;border-radius:999px;background:var(--bg);color:var(--fg);\n  border:1.5px solid var(--bg);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s,color .3s;\n  white-space:nowrap;\n}\n.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px rgba(15,76,92,.6)}\n.btn .arr{transition:transform .3s var(--ease)}\n.btn:hover .arr{transform:translateX(3px)}\n.btn.navy{--bg:var(--navy)}\n.btn.lav{--bg:var(--lavender);--fg:var(--navy)}\n.btn.ghost{--bg:transparent;--fg:var(--ink);border-color:var(--line)}\n.btn.ghost:hover{border-color:var(--ink);box-shadow:none}\n.btn.on-dark.ghost{--fg:#fff;border-color:rgba(255,255,255,.32)}\n.btn.on-dark.ghost:hover{border-color:#fff}\n.btn.lg{padding:1.1em 2.1em;font-size:.86rem}\n.link-arrow{display:inline-flex;align-items:center;gap:.5em;font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}\n.link-arrow .arr{transition:transform .3s var(--ease)}\n.link-arrow:hover .arr{transform:translateX(4px)}\n\n/* ===== Nav ===== */\n.announce{background:var(--navy);color:#cbd3da;font-size:.78rem;letter-spacing:.04em;text-align:center;padding:.6rem 1rem}\n.announce a{color:#fff;font-weight:600;border-bottom:1px solid var(--lavender);padding-bottom:1px}\n.announce strong{color:var(--lavender);font-weight:600}\nheader.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}\nheader.nav.scrolled{border-color:var(--line);box-shadow:0 10px 30px -24px rgba(14,27,45,.4)}\n.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding-block:.85rem}\n.brand{display:flex;align-items:center;gap:.7rem}\n.brand .mark{width:42px;height:42px;flex:none}\n.brand .wordmark{font-family:var(--serif);font-weight:600;font-size:1.18rem;letter-spacing:.14em;line-height:1;color:var(--navy)}\n.brand .wordmark small{display:block;font-family:var(--sans);font-weight:500;font-size:.52rem;letter-spacing:.42em;color:var(--teal);margin-top:3px}\n.nav-links{display:flex;align-items:center;gap:2rem}\n.nav-links a:not(.btn){font-weight:500;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);position:relative;padding-block:.4rem}\n.nav-links a:not(.btn)::after{content:\"\";position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--teal);transition:width .3s var(--ease)}\n.nav-links a:not(.btn):hover{color:var(--ink)}\n.nav-links a:not(.btn):hover::after{width:100%}\n.nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;color:var(--navy)}\n\n/* ===== Hero ===== */\n.hero{position:relative;overflow:hidden}\n.hero-grid{display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(32px,5vw,72px);align-items:center}\n.hero .display{margin-bottom:1.4rem}\n.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem;align-items:center}\n.hero-media{position:relative}\n.hero-media .photo{width:100%;height:auto;aspect-ratio:4/4.7;border-radius:18px;box-shadow:var(--shadow)}\n.hero-badge{position:absolute;left:-22px;bottom:34px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:.8rem;max-width:230px}\n.hero-badge .dot{width:38px;height:38px;border-radius:10px;background:var(--lav-tint);display:grid;place-items:center;color:var(--teal);flex:none}\n.hero-badge b{font-family:var(--serif);font-size:1.2rem;display:block;line-height:1}\n.hero-badge span{font-size:.72rem;color:var(--muted);letter-spacing:.04em}\n.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:-1}\n.blob.l{width:420px;height:420px;background:var(--lav-tint);top:-120px;right:-80px}\n.blob.t{width:360px;height:360px;background:var(--teal-tint);bottom:-160px;left:-120px}\n\n/* circuit deco */\n.circuit{position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.5}\n\n/* ===== Pillars ===== */\n.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}\n.pillar{background:#fff;padding:2rem 1.6rem;transition:background .3s}\n.pillar:hover{background:var(--mist)}\n.pillar .ic{width:40px;height:40px;color:var(--teal);margin-bottom:1.1rem}\n.pillar h3{font-size:1.15rem;margin-bottom:.5rem}\n.pillar p{font-size:.92rem;color:var(--muted);margin:0}\n.pillar .klabel{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:.7rem}\n\n/* ===== Manifesto ===== */\n.manifesto .big{font-size:clamp(1.9rem,4vw,3.2rem);line-height:1.18;max-width:20ch}\n\n/* ===== Contrast ===== */\n.contrast{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,40px)}\n.col-card{border-radius:18px;padding:clamp(28px,3.2vw,44px)}\n.col-card.old{background:#fff;border:1px solid var(--line)}\n.col-card.new{background:var(--navy);color:#dce1e7}\n.col-card h3{font-size:1.35rem;margin-bottom:1.6rem}\n.col-card.new h3{color:#fff}\n.col-card ul{list-style:none;margin:0;padding:0;display:grid;gap:1rem}\n.col-card li{display:flex;gap:.85rem;align-items:flex-start;font-size:.98rem;line-height:1.4}\n.col-card li .ti{flex:none;margin-top:2px}\n.col-card.old li{color:var(--muted)}\n.col-card.old .ti{color:#c2c7cf}\n.col-card.new .ti{color:var(--lavender)}\n.tag{display:inline-flex;align-items:center;gap:.5em;font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:.4em .9em;border-radius:999px;margin-bottom:1.4rem}\n.tag.old{background:var(--mist);color:var(--muted)}\n.tag.new{background:rgba(172,162,201,.2);color:var(--lavender)}\n\n/* ===== Fer ===== */\n.fer-grid{display:grid;grid-template-columns:1.15fr .95fr;gap:clamp(32px,5vw,72px);align-items:center}\n.fer-media{position:relative}\n.fer-media .photo{width:100%;height:auto;aspect-ratio:4/3.2;border-radius:18px;box-shadow:var(--shadow);background:#fff;--empty-bg:#fff}\n.fer-media .accent-frame{position:absolute;inset:18px -18px -18px 18px;border:1.5px solid var(--lavender);border-radius:18px;z-index:-1}\n.signature{font-family:var(--serif);font-style:italic;font-size:1.8rem;color:var(--teal);margin-top:.4rem}\n.stat-row{display:flex;gap:2.4rem;margin-top:2rem;flex-wrap:wrap}\n.stat b{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--navy);display:block}\n.stat span{font-size:.78rem;letter-spacing:.04em;color:var(--muted)}\n.quote-block{border-left:2px solid var(--lavender);padding-left:1.5rem;font-family:var(--serif);font-style:italic;font-size:1.3rem;line-height:1.45;color:var(--ink-soft);margin:1.8rem 0}\n\n/* ===== Programs ===== */\n.prog{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,3vw,36px)}\n.prog-card{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}\n.prog-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}\n.prog-card .top{padding:clamp(28px,3vw,42px) clamp(28px,3vw,42px) 1.4rem}\n.prog-card .kicker{font-weight:700;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:1rem;display:inline-flex;align-items:center;gap:.5em}\n.prog-card.inside .kicker{color:var(--sage)}\n.prog-card.pni .kicker{color:var(--lavender)}\n.prog-card h3{font-size:2rem;margin-bottom:.7rem}\n.prog-card .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 0}\n.chip{font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:.45em .9em;border-radius:999px;background:var(--mist);color:var(--ink-soft)}\n.prog-card .feats{list-style:none;margin:1.6rem 0 0;padding:0;display:grid;gap:.8rem}\n.prog-card .feats li{display:flex;gap:.7rem;align-items:flex-start;font-size:.94rem;color:var(--ink-soft)}\n.prog-card .feats .ti{color:var(--teal);flex:none;margin-top:3px}\n.prog-card .foot{margin-top:auto;padding:1.6rem clamp(28px,3vw,42px) clamp(28px,3vw,42px);border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:1rem}\n.prog-card .ribbon{height:5px;width:100%}\n.prog-card.inside .ribbon{background:linear-gradient(90deg,var(--sage),var(--teal))}\n.prog-card.pni .ribbon{background:linear-gradient(90deg,var(--lavender),var(--navy))}\n\n/* ===== Method ===== */\n.method{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,64px);align-items:start}\n.phases{display:grid;gap:14px}\n.phase{border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03);transition:background .3s,border-color .3s}\n.phase.open{background:rgba(172,162,201,.1);border-color:rgba(172,162,201,.4)}\n.phase-head{display:flex;align-items:center;gap:1.1rem;padding:1.25rem 1.4rem;cursor:pointer;width:100%;background:none;border:none;text-align:left;color:inherit;font-family:inherit}\n.phase-num{font-family:var(--serif);font-size:1.1rem;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--lavender);color:var(--lavender);display:grid;place-items:center;flex:none}\n.phase.open .phase-num{background:var(--lavender);color:var(--navy)}\n.phase-head h4{font-size:1.18rem;color:#fff;flex:1}\n.phase-head .pi{transition:transform .3s var(--ease);color:var(--lavender)}\n.phase.open .pi{transform:rotate(45deg)}\n.phase-body{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}\n.phase-body .pb-inner{padding:0 1.4rem 1.4rem 5.1rem;color:#b9c1ca;font-size:.96rem}\n\n/* ===== Testimonials ===== */\n.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}\n.tcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,2.6vw,34px);display:flex;flex-direction:column}\n.tcard .stars{color:var(--lavender);letter-spacing:.2em;font-size:.9rem;margin-bottom:1.1rem}\n.tcard p{font-size:.98rem;color:var(--ink-soft);line-height:1.55}\n.tcard .who{display:flex;align-items:center;gap:.85rem;margin-top:auto;padding-top:1.4rem}\n.tcard .av{width:46px;height:46px;border-radius:50%;flex:none}\n.tcard .av.mono{display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.18rem;color:#fff;line-height:1;user-select:none}\n.tcard .av.mono.q{font-size:1.7rem;padding-top:.42em}\n.tcard .av.c1{background:linear-gradient(135deg,var(--teal),#0c3f4a)}\n.tcard .av.c2{background:linear-gradient(135deg,var(--lavender),#9a86d4)}\n.tcard .av.c3{background:linear-gradient(135deg,var(--sage,#5b8b6f),#3f6e54)}\n.tcard .who b{display:block;font-size:.92rem;font-family:var(--serif)}\n.tcard .who span{font-size:.78rem;color:var(--muted)}\n\n/* ===== CTA ===== */\n.cta-final{position:relative;overflow:hidden;text-align:center}\n.cta-final .circuit{opacity:.18}\n.cta-final .btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}\n\n/* ===== Footer ===== */\nfooter{background:#0a1422;color:#9aa4b0;padding-block:clamp(56px,7vw,88px) 2rem}\n.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:clamp(28px,4vw,56px)}\nfooter .brand .wordmark{color:#fff}\nfooter h5{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 1.1rem}\nfooter ul{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}\nfooter ul a{font-size:.92rem;color:#9aa4b0;transition:color .2s}\nfooter ul a:hover{color:#fff}\n.news{display:flex;gap:.5rem;margin-top:1rem}\n.news input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.8em 1.1em;color:#fff;font-family:inherit;font-size:.88rem}\n.news input::placeholder{color:#6b7681}\n.news button{background:var(--lavender);color:var(--navy);border:none;border-radius:999px;padding:0 1.3em;font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}\n.socials{display:flex;gap:.7rem;margin-top:1.3rem}\n.socials a{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;color:#cbd3da;transition:background .2s,color .2s,border-color .2s}\n.socials a:hover{background:#fff;color:var(--navy);border-color:#fff}\n.foot-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:clamp(40px,5vw,64px);padding-top:1.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:#6b7681}\n\n/*     <p>Alineamos tu negocio con una dirección concreta y medible.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"ic\"><use href=\"#i-sistemas\"><\u002Fuse><\u002Fsvg>\n        <div class=\"klabel\">Sistemas<\u002Fdiv>\n        <h3>Que se multiplican<\u002Fh3>\n        <p>Creamos estructuras que funcionan sin que estés en cada detalle.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"ic\"><use href=\"#i-ia\"><\u002Fuse><\u002Fsvg>\n        <div class=\"klabel\">IA aplicada<\u002Fdiv>\n        <h3>En lo que importa<\u002Fh3>\n        <p>Aplicamos inteligencia a los procesos clave de tu negocio.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"ic\"><use href=\"#i-resultados\"><\u002Fuse><\u002Fsvg>\n        <div class=\"klabel\">Resultados<\u002Fdiv>\n        <h3>Impacto real<\u002Fh3>\n        <p>Medimos, optimizamos y generamos impacto sostenible.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CONTRASTE ===== -->\n<section id=\"contraste\">\n  <div class=\"wrap\">\n    <div class=\"center reveal\" style=\"margin-bottom:clamp(36px,4vw,56px)\">\n      <span class=\"eyebrow center\">Por qué Renacer<\u002Fspan>\n      <h2 class=\"h1 measure mx-auto\">Trabajar más no es la respuesta. Trabajar con <em>sistemas inteligentes<\u002Fem>, sí.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"contrast reveal\">\n      <div class=\"col-card old\">\n        <span class=\"tag old\">El viejo modelo<\u002Fspan>\n        <h3>Negocios que se estancan<\u002Fh3>\n        <ul>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg> Todo depende de vos para avanzar<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg> Crecen a fuerza de horas y desgaste<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg> Procesos sueltos, sin orden ni datos<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg> Siempre reaccionando, nunca anticipando<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg> Miran la IA de lejos, sin saber por dónde empezar<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"col-card new\">\n        <span class=\"tag new\">El modelo Renacer<\u002Fspan>\n        <h3>Negocios que renacen<\u002Fh3>\n        <ul>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Sistemas que sostienen las decisiones<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Crecen con orden, automatización y flujo<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Datos que se vuelven decisiones<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Se anticipan a lo que viene<\u002Fli>\n          <li><svg class=\"ti\" width=\"20\" height=\"20\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Usan IA aplicada a lo que genera resultados<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== FER KASPIN ===== -->\n<section id=\"fer\" class=\"section-mist\">\n  <div class=\"wrap fer-grid\">\n    <div class=\"fer-media reveal\">\n      <img src=\"data:image/webp;base64,UklGRszbAABXRUJQVlA4WAoAAAAgAAAAcAIAQQMASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAM Fdiv>\n      <p class=\"signature\">Fer Kaspin<\u002Fp>\n      <a href=\"https://wa.me/50764147770?text=Hola%20Fer%2C%20quiero%20trabajar%20con%20vos%20en%20mi%20negocio.\" target=\"_blank\" rel=\"noopener\" class=\"btn\" style=\"margin-top:.4rem\">Trabajemos juntos <svg class=\"arr\" width=\"16\" height=\"16\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== PROGRAMAS: INSIDE + PNI ===== -->\n<section id=\"programas\">\n  <div class=\"wrap\">\n    <div class=\"center reveal\" style=\"margin-bottom:clamp(40px,5vw,60px)\">\n      <span class=\"eyebrow center\">Cómo te puedo ayudar<\u002Fspan>\n      <h2 class=\"h1 measure mx-auto\">Dos caminos, según <em>quién sos<\u002Fem>.<\u002Fh2>\n      <p class=\"lead measure mx-auto\" style=\"margin-top:1rem\">No trabajo igual con todos. Si tenés una <strong>empresa con equipo<\u002Fstrong>, entro a trabajar adentro con INSIDE. Si sos <strong>profesional independiente o emprendedor<\u002Fstrong>, tu camino es el Programa de Negocios Inteligentes.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"prog reveal\">\n      <!-- INSIDE -->\n      <article class=\"prog-card inside\" id=\"inside\">\n        <span class=\"ribbon\"><\u002Fspan>\n        <div class=\"top\">\n          <span class=\"kicker\"><svg width=\"16\" height=\"16\"><use href=\"#i-sistemas\"><\u002Fuse><\u002Fsvg> Para empresas con equipo<\u002Fspan>\n          <h3>INSIDE<\u002Fh3>\n          <p class=\"muted\">Entramos a tu empresa y trabajamos codo a codo con tu equipo. Detectamos los cuellos de botella que les hacen perder tiempo, los resolvemos con sistemas e IA, y tu gente trabaja más rápido y más efectiva.<\u002Fp>\n          <div class=\"meta\">\n            <span class=\"chip\">Con tu equipo<\u002Fspan>\n            <span class=\"chip\">A medida<\u002Fspan>\n            <span class=\"chip\">Hands-on<\u002Fspan>\n            <span class=\"chip\">En tu operación<\u002Fspan>\n          <\u002Fdiv>\n          <ul class=\"feats\">\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Mapeamos los cuellos de botella reales de tu día a día<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Automatizamos las tareas que le hacen perder horas a tu equipo<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Implementamos IA y sistemas dentro de tu empresa, no en teoría<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Tu gente aprende a sostenerlo y gana tiempo para lo importante<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"foot\">\n          <a href=\"Diagnostico.html\" class=\"btn ghost\">Agendar diagnóstico<\u002Fa>\n          <a href=\"#hablemos\" class=\"link-arrow\" style=\"color:var(--sage)\">Cómo trabajamos <svg class=\"arr\" width=\"14\" height=\"14\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <!-- PNI -->\n      <article class=\"prog-card pni\" id=\"pni\">\n        <span class=\"ribbon\"><\u002Fspan>\n        <div class=\"top\">\n          <span class=\"kicker\"><svg width=\"16\" height=\"16\"><use href=\"#i-ia\"><\u002Fuse><\u002Fsvg> Para profesionales independientes y emprendedores<\u002Fspan>\n          <h3>PNI<\u002Fh3>\n          <p class=\"muted\"><strong>Programa de Negocios Inteligentes.<\u002Fstrong> Aprendés a poner la inteligencia artificial a trabajar con vos: dejás de improvisar con prompts sueltos y empezás a operar tu negocio con un sistema real.<\u002Fp>\n          <ul class=\"feats\">\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Una base inteligente con el contexto real de tu negocio<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> 4 agentes: Mano Derecha, Marketing, Ventas y Finanzas<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> 6 semanas de implementación guiada en vivo<\u002Fli>\n            <li><svg class=\"ti\" width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg> Mapa claro para seguir creciendo tu negocio inteligente<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"foot\">\n          <a href=\"PNI.html\" class=\"btn lav\">Agosto 2026 <svg class=\"arr\" width=\"15\" height=\"15\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== MÉTODO ===== -->\n<section id=\"metodo\" class=\"section-navy\">\n  <span class=\"circuit\" id=\"circuit-method\"><\u002Fspan>\n  <div class=\"wrap method\">\n    <div class=\"reveal\">\n      <span class=\"eyebrow\" style=\"color:var(--lavender)\">El método Renacer<\u002Fspan>\n      <h2 class=\"h1\">Cómo construimos tu negocio inteligente.<\u002Fh2>\n      <p class=\"lead\" style=\"color:#b9c1ca\">Un proceso en tres etapas que ordena el caos y lo convierte en un sistema que piensa con vos. Es la columna del PNI y la lógica detrás de todo lo que hago.<\u002Fp>\n      <a href=\"Diagnostico.html\" class=\"btn lav lg\" style=\"margin-top:1.6rem\">Empezar mi diagnóstico <svg class=\"arr\" width=\"16\" height=\"16\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n    <div class=\"phases reveal\" id=\"phases\">\n      <div class=\"phase open\">\n        <button class=\"phase-head\" aria-expanded=\"true\">\n          <span class=\"phase-num\">01<\u002Fspan>\n          <h4>Diagnóstico y estrategia<\u002Fh4>\n          <svg class=\"pi\" width=\"22\" height=\"22\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"phase-body\"><div class=\"pb-inner\">Antes de automatizar nada, entendemos tu negocio: dónde se pierde tiempo, qué decisiones te frenan y qué resultados querés mover. De ahí sale una estrategia clara, con foco y dirección. Sin orden, la IA solo acelera el caos.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"phase\">\n        <button class=\"phase-head\" aria-expanded=\"false\">\n          <span class=\"phase-num\">02<\u002Fspan>\n          <h4>Sistemas e IA aplicada<\u002Fh4>\n          <svg class=\"pi\" width=\"22\" height=\"22\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"phase-body\"><div class=\"pb-inner\">Acá pasa la magia. Diseñamos e implementamos los sistemas y automatizaciones que tu negocio necesita, con inteligencia aplicada a los procesos clave. No prompts genéricos: soluciones que tu equipo puede usar para obtener resultados consistentes.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"phase\">\n        <button class=\"phase-head\" aria-expanded=\"false\">\n          <span class=\"phase-num\">03<\u002Fspan>\n          <h4>Resultados y escala<\u002Fh4>\n          <svg class=\"pi\" width=\"22\" height=\"22\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"phase-body\"><div class=\"pb-inner\">Convertimos los primeros logros en transformación sostenible. Medimos el impacto real, optimizamos lo que funciona y lo expandimos a todo el negocio, para que crezca igual de bien estés o no en cada detalle.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== TESTIMONIOS ===== -->\n<section id=\"testimonios\">\n  <div class=\"wrap\">\n    <div class=\"center reveal\" style=\"margin-bottom:clamp(36px,4vw,56px)\">\n      <span class=\"eyebrow center\">Palabras reales, de personas reales<\u002Fspan>\n      <h2 class=\"h1 measure mx-auto\">Lo que cambia cuando tu negocio empieza a <em>pensar mejor<\u002Fem>.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"tcards reveal\">\n      <article class=\"tcard\">\n        <div class=\"stars\">★★★★★<\u002Fdiv>\n        <p>Pasé de vivir apagando incendios a tener un negocio con orden. Hoy las decisiones se toman sobre datos, no sobre la intuición del día. Renacer me devolvió la claridad.<\u002Fp>\n        <div class=\"who\">\n          <span class=\"av mono q c1\" aria-hidden=\"true\">“<\u002Fspan>\n          <div><b>Cliente Renacer<\u002Fb><span>Dueña de negocio · Servicios<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"tcard\">\n        <div class=\"stars\">★★★★★<\u002Fdiv>\n        <p>No sabía por dónde empezar con la IA. Fer lo bajó a tierra: sistemas concretos, aplicados a mi negocio. Lo que antes me llevaba horas, hoy se resuelve solo.<\u002Fp>\n        <div class=\"who\">\n          <span class=\"av mono q c2\" aria-hidden=\"true\">“<\u002Fspan>\n          <div><b>Cliente Renacer<\u002Fb><span>Emprendedor · E-commerce<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"tcard\">\n        <div class=\"stars\">★★★★★<\u002Fdiv>\n        <p>El PNI me ordenó la cabeza y el negocio al mismo tiempo. Salí con sistemas funcionando y un equipo que avanza sin depender de mí para cada paso.<\u002Fp>\n        <div class=\"who\">\n          <span class=\"av mono q c3\" aria-hidden=\"true\">“<\u002Fspan>\n          <div><b>Cliente Renacer<\u002Fb><span>Fundadora · Consultoría<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CTA FINAL ===== -->\n<section id=\"hablemos\" class=\"section-navy cta-final\">\n  <span class=\"circuit\" id=\"circuit-cta\"><\u002Fspan>\n  <div class=\"wrap\">\n    <div class=\"reveal measure-tight mx-auto\">\n      <span class=\"eyebrow center\" style=\"color:var(--lavender)\">Hablemos<\u002Fspan>\n      <h2 class=\"h1\">Tu negocio puede decidir mejor. Empecemos por un diagnóstico.<\u002Fh2>\n      <p class=\"lead\" style=\"color:#b9c1ca;margin-top:1rem\">Una conversación para ver con claridad dónde está hoy tu negocio y qué sistema lo llevaría a su próximo nivel. Sin vueltas, sin tecnicismos.<\u002Fp>\n      <div class=\"btn-row\">\n        <a href=\"Diagnostico.html\" class=\"btn lav lg\">Agendar diagnóstico <svg class=\"arr\" width=\"16\" height=\"16\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ===== FOOTER ===== -->\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div>\n        <a class=\"brand\" href=\"#top\" style=\"margin-bottom:1.2rem\">\n          <svg class=\"mark\" style=\"color:#fff;width:46px;height:46px\"><use href=\"#mark\"><\u002Fuse><\u002Fsvg>\n          <span class=\"wordmark\">RENACER<small style=\"color:var(--lavender)\">EN DIGITAL<\u002Fsmall><\u002Fspan>\n        <\u002Fa>\n        <p style=\"font-size:.92rem;max-width:34ch\">Inteligencia aplicada a negocios que crecen. Estrategia · Sistemas · Resultados.<\u002Fp>\n        <div class=\"socials\">\n          <a href=\"#\" aria-label=\"Instagram\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n          <a href=\"#\" aria-label=\"LinkedIn\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4 0 4.75 2.5 4.75 5.75V21h-4v-5c0-1.2 0-2.75-1.7-2.75s-1.95 1.3-1.95 2.66V21H9z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <a href=\"#\" aria-label=\"WhatsApp\"><svg width=\"18\" height=\"18\" viewBox=\"0  reservados.<\u002Fspan>\n      <span>Inteligencia aplicada a negocios que crecen.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"6d60084c-09c0-4629-a18d-13fcb53acca5\"><\u002Fscript>\n<script>\n// Nav scroll state\nconst nav=document.getElementById('nav');\naddEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>10),{passive:true});\n\n// Mobile menu\nconst toggle=document.getElementById('navToggle'),links=document.getElementById('navlinks');\ntoggle.addEventListener('click',()=>links.classList.toggle('open'));\nlinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')));\n\n// Method accordion\ndocument.querySelectorAll('#phases .phase-head').forEach(btn=>{\n  btn.addEventListener('click',()=>{\n    const phase=btn.closest('.phase');\n    const body=phase.querySelector('.phase-body');\n    const isOpen=phase.classList.contains('open');\n    document.querySelectorAll('#phases .phase').forEach(p=>{\n      p.classList.remove('open');\n      p.querySelector('.phase-body').style.maxHeight=null;\n      p.querySelector('.phase-head').setAttribute('aria-expanded','false');\n    });\n    if(!isOpen){\n      phase.classList.add('open');\n      body.style.maxHeight=body.scrollHeight+'px';\n      btn.setAttribute('aria-expanded','true');\n    }\n  });\n});\n// open first by default\n(function(){const f=document.querySelector('#phases .phase.open .phase-body');if(f)f.style.maxHeight=f.scrollHeight+'px';})();\n\n// Reveal on scroll\nconst io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12,rootMargin:'0px 0px -8% 0px'});\ndocument.querySelectorAll('.reveal').forEach(el=>io.observe(el));\n// Failsafe: some embedded/throttled iframes freeze CSS transitions mid-flight,\n// leaving content stuck at opacity:0. After a short grace period, force every\n// reveal to its final visible state directly (kills transition) so content can\n// NEVER stay hidden. Real browsers have already animated in by this point.\nsetTimeout(()=>{\n  document.querySelectorAll('.reveal').forEach(el=>{\n    el.classList.add('in');\n    el.style.transition='none';\n    el.style.opacity='1';\n    el.style.transform='none';\n  });\n},1400);\n\n// Subtle circuit decoration (SVG)\nfunction circuit(el){\n  if(!el)return;\n  const w=el.clientWidth||1200,h=el.clientHeight||600;\n  const ns='http://www.w3.org/2000/svg';\n  const svg=document.createElementNS(ns,'svg');\n  svg.setAttribute('width','100%');svg.setAttribute('height','100%');\n  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');\n  for(let i=0;i<14;i++){\n    const x=Math.random()*w,y=Math.random()*h;\n    const len=40+Math.random()*120;\n    const dir=Math.random()>.5?1:0;\n    const p=document.createElementNS(ns,'path');\n    p.setAttribute('d',dir?`M${x} ${y} h${len} v${30+Math.random()*40}`:`M${x} ${y} v${len} h${30+Math.random()*40}`);\n    p.setAttribute('fill','none');p.setAttribute('stroke','#ACA2C9');p.setAttribute('stroke-width','1');p.setAttribute('opacity','.5');\n    svg.appendChild(p);\n    const c=document.createElementNS(ns,'circle');\n    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','3');c.setAttribute('fill','#ACA2C9');\n    svg.appendChild(c);\n  }\n  el.appendChild(svg);\n}\ncircuit(document.getElementById('circuit-method'));\ncircuit(document.getElementById('circuit-cta'));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
